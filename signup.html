<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X CRM — Sign Up</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName">
          <p class="field-error" data-error-for="fullName"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="text" id="email" name="email">
          <p class="field-error" data-error-for="email"></p>
        </div>
        <div class="field">
          <label for="company">Company</label>
          <input type="text" id="company" name="company" placeholder="Company (optional)">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password">
          <p class="field-error" data-error-for="password"></p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword">
          <p class="field-error" data-error-for="confirmPassword"></p>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/auth.js"></script>
  <script>Guard.redirectIfAuthed(); initSignupForm();</script>
</body>
</html>
